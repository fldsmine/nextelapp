name: nextel_connect
publish_to: "none"
description: Flutter migration of the Nextel Android application.
version: 3.5.0-alpha+4

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  flutter_inappwebview: ^6.2.0-beta.3
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  audioplayers: ^6.4.0
  confetti: ^0.8.0
  date_format: ^2.0.9
  lottie: ^3.3.1
  material_design_icons_flutter: ^7.0.7296
  path: ^1.9.1
  provider: ^6.1.2
  rflutter_alert: ^2.0.7
  simple_ripple_animation: ^0.1.0
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides: {}

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/res/
    - assets/sounds/
  fonts:
    - family: Patrick
      fonts:
        - asset: assets/fonts/patrick_regular.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/patrick_hand_regular.ttf
    - family: FiraMono
      fonts:
        - asset: assets/fonts/fira_mono_regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto_regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito_regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat_regular.ttf
